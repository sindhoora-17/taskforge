name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Build worker
        run: go build ./cmd/worker

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t taskforge:test .